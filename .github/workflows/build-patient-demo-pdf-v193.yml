name: Generate synthetic Lee PDF and preview on isolated design branch
on:
  push:
    branches: [feat/patient-v19-3-final-polish]
    paths:
      - 'patient/assets/lee-walker-guide-source.html'
      - 'scripts/build_patient_demo_pdf_v193.py'
      - '.github/workflows/build-patient-demo-pdf-v193.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-fixture:
    if: github.ref == 'refs/heads/feat/patient-v19-3-final-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Korean rendering fonts + Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          python -m pip install playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Render and verify the synthetic-only PDF
        run: python scripts/build_patient_demo_pdf_v193.py
      - name: Upload PDF and PNG for visual review
        uses: actions/upload-artifact@v4
        with:
          name: Lee-walker-guide-v193-PDF-preview
          path: |
            patient/assets/lee-walker-guide-v193.pdf
            patient/assets/lee-walker-guide-v193.png
      - name: Commit binary fixture on development branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patient/assets/lee-walker-guide-v193.pdf patient/assets/lee-walker-guide-v193.png
          if ! git diff --cached --quiet; then
            git commit -m "build(patient-demo): refreshed searchable PDF and preview from preserved synthetic copy"
            git push origin HEAD:feat/patient-v19-3-final-polish
          fi
