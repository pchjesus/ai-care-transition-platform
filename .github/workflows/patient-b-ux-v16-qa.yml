name: CareBridgeLab patient B UX v1.6 candidate QA
on:
  push:
    branches: [feat/patient-b-ux-v16]
    paths:
      - 'prototypes/integrated-v10/patient/patient-v16-*'
      - 'prototypes/integrated-v10/patient/v16.html'
      - 'prototypes/integrated-v10/tests/patient_v16_candidate_qa.py'
      - '.github/workflows/patient-b-ux-v16-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patient-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and candidate isolation
        run: |
          node --check prototypes/integrated-v10/patient/patient-v16-app.js
          python - <<'PY'
          from pathlib import Path
          base=Path('prototypes/integrated-v10/patient')
          orig=(base/'index.html').read_text()
          trial=(base/'v16.html').read_text()
          assert 'src="app.js"' in orig and 'src="patient-v16-app.js"' not in orig
          assert 'src="patient-v16-app.js"' in trial and 'patient-v16.css' in trial
          assert 'src="patient-v15.js"' in trial
          assert (base/'app.js').read_text().count('readPatientPublication')>=1
          PY
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Integrated A3 to patient B v1.6 browser acceptance
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/carebridge-patient-v16-server.log 2>&1 &
          sleep 2
          python prototypes/integrated-v10/tests/patient_v16_candidate_qa.py
      - name: Keep candidate screenshots and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-b-v16-candidate-browser-qa
          path: |
            /tmp/carebridge-patient-v16-qa/
            prototypes/integrated-v10/patient/v16.html
            prototypes/integrated-v10/patient/patient-v16.css
            prototypes/integrated-v10/patient/patient-v16-app.js
          if-no-files-found: warn
