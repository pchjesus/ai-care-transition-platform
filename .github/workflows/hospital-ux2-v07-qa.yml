name: CareBridgeLab UX2 v0.7 A3-B-home integration QA
on:
  push:
    branches: [feat/hospital-ux2-v07]
    paths:
      - 'prototypes/hospital-ux2-v07/**'
      - 'prototypes/integrated-v10/index.html'
      - 'prototypes/integrated-v10/legacy-home-v10.html'
      - '.github/workflows/hospital-ux2-v07-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation and syntax
        run: |
          node --check prototypes/hospital-ux2-v07/integration.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('prototypes/hospital-ux2-v07/index.html').read_text()
          assert 'integration.js' in s and 'integration.css' in s
          assert 'integrated-v10/index.html' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)>=2
          for n,c in enumerate(scripts):Path(f'/tmp/ux7-{n}.js').write_text(c)
          home=Path('prototypes/integrated-v10/index.html').read_text()
          assert 'hospital-ux2-v07' in home and 'patient/index.html' in home
          PY
          for f in /tmp/ux7-*.js; do node --check "$f"; done
      - name: Original A3 and patient publication domain regressions
        run: |
          node --test prototypes/integrated-v10/a3/tests/*.test.js prototypes/integrated-v10/shared/*.test.js
      - name: Browser prerequisites
        run: |
          python -m pip install playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Full new hospital to patient and home browser checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/ux7-server.log 2>&1 &
          sleep 2
          python prototypes/hospital-ux2-v07/tests/integration_v07.py
          python - <<'PY'
          from pathlib import Path
          path=Path('prototypes/hospital-ux2-v06/tests/browser_smoke.py')
          text=path.read_text().replace('hospital-ux2-v06/index.html','hospital-ux2-v07/index.html')
          Path('/tmp/ux7-v06-safety-regression.py').write_text(text)
          PY
          python /tmp/ux7-v06-safety-regression.py
      - name: Preserve HTML and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carebridge-ux2-v07-html-and-qa
          path: |
            prototypes/hospital-ux2-v07/
            prototypes/integrated-v10/index.html
            prototypes/integrated-v10/legacy-home-v10.html
            /tmp/carebridge-v07-qa/
          if-no-files-found: warn
