name: IR evidence screenshots (temporary branch)
on:
  push:
    branches:
      - chore/ir-screenshots-20261103
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Screenshot dependencies
        run: |
          python -m pip install playwright
          test -x /usr/bin/chromium || { test -x /usr/bin/google-chrome && sudo ln -s /usr/bin/google-chrome /usr/bin/chromium; }
      - name: Capture synthetic A1 A2 A3 B
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          python .github/scripts/ir_capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ir-screenshots-20261103
          path: /tmp/ir-screenshots
          if-no-files-found: warn
