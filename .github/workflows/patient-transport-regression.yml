name: Patient transport UI regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  travel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and existing unit contracts
        working-directory: prototypes/integrated-v10
        run: |
          node --check patient/comfort-ui.js
          npm test
      - name: Browser setup
        run: |
          python -m pip install --disable-pip-version-check playwright
          if [ ! -x /usr/bin/chromium ] && [ -x /usr/bin/google-chrome ]; then sudo ln -s /usr/bin/google-chrome /usr/bin/chromium; fi
          test -x /usr/bin/chromium
      - name: Focused standalone and A3-connected transport UI
        working-directory: prototypes/integrated-v10
        run: |
          python tests/transport_ui_http.py
          python tests/comfort_http.py Comfort.test_map_verified_snapshot_external_link_blocked_fallback_and_missing_address
