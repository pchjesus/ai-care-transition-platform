name: CareBridgeLab hospital UX2 v0.6 integration QA
on:
  push:
    branches: [feat/hospital-ux2-v06]
    paths:
      - 'prototypes/hospital-ux2-v06/**'
      - '.github/workflows/hospital-ux2-v06-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authoring-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate v0.6 syntax
        run: |
          node --check prototypes/hospital-ux2-v06/integration.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('prototypes/hospital-ux2-v06/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          assert len(scripts)==2
          for n,s in enumerate(scripts): Path(f'/tmp/ux6-{n}.js').write_text(s)
          assert 'integration.js' in h and 'integration.css' in h
          PY
          for f in /tmp/ux6-*.js; do node --check "$f"; done
      - name: Run original A3 persistence and workflow tests
        run: |
          node --test prototypes/integrated-v10/a3/tests/*.test.js prototypes/integrated-v10/shared/*.test.js
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Run HTTP browser and storage regression
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/ux6-server.log 2>&1 &
          sleep 2
          python prototypes/hospital-ux2-v06/tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carebridge-hospital-ux2-v06-preview-and-qa
          path: |
            prototypes/hospital-ux2-v06/
            /tmp/carebridge-ux6-qa/
          if-no-files-found: warn
