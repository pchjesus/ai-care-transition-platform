name: Patient B v1.1 review screenshots and regression
on:
  push:
    branches:
      - feature/patient-minimal-information-v11-20261102
permissions:
  contents: read
jobs:
  patient-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax and existing unit contracts
        working-directory: prototypes/integrated-v10
        run: |
          node --check patient/app.js
          node --check patient/comfort-ui.js
          npm test
      - name: Install browser testing dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          if [ ! -x /usr/bin/chromium ] && [ -x /usr/bin/google-chrome ]; then sudo ln -s /usr/bin/google-chrome /usr/bin/chromium; fi
          test -x /usr/bin/chromium
      - name: Focused v1.1 mobile tablet desktop visual capture and smoke
        working-directory: prototypes/integrated-v10
        run: python tests/patient_v11_visual_qa.py
      - name: Existing taxi preparation and transport regression
        working-directory: prototypes/integrated-v10
        run: |
          python tests/taxi_preview_http.py
          python tests/transport_ui_http.py
      - name: Existing clinician publication and patient comfort regression
        working-directory: prototypes/integrated-v10
        run: python tests/comfort_http.py
      - name: Upload visual screenshots and smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-v11-review-screenshots
          path: artifacts/patient-v11/
          if-no-files-found: warn
