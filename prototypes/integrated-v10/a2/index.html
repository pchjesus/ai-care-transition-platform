<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#214B3B" />
<meta name="description" content="가상의 고령 근골격계 퇴원환자를 대상으로 여섯 영역을 평가하는 병원용 A2 디자인 목업"/>
<title>A2 관리 필요도 평가 v0.5 | 병원 워크벤치</title>
<link rel="stylesheet" href="./styles.css"/>
<link rel="stylesheet" href="../integration.css"/>
<script type="module" src="./app.js"></script>
</head>
<body>
<div class="shell">
  <aside class="rail" id="work-rail" aria-label="병원 업무 메뉴">
    <div class="rail-top">
      <div class="brand"><div class="brand-icon" aria-hidden="true">D<span>.</span></div><div class="brand-copy"><strong>퇴원관리 워크벤치</strong><small>Clinical workspace</small></div></div>
      <button id="toggle-rail" class="rail-toggle" type="button" aria-controls="work-rail" aria-expanded="true" aria-label="사이드바 접기" title="사이드바 접기">‹</button>
    </div>
    <div class="rail-section">업무 흐름</div>
    <button id="open-a1" class="rail-link" type="button" aria-label="A1 · 환자 목록" title="A1 · 환자 목록"><span class="step-icon" aria-hidden="true">A1</span><span class="rail-link-copy">환자 목록</span><span class="rail-end" aria-hidden="true">↗</span></button>
    <button id="open-a2" class="rail-link is-current" type="button" aria-current="page" aria-label="A2 · 다영역 평가" title="A2 · 다영역 평가"><span class="step-icon" aria-hidden="true">A2</span><span class="rail-link-copy">다영역 평가</span><span class="rail-end" aria-hidden="true">●</span></button>
    <button id="open-a3" class="rail-link" type="button" aria-label="A3 · 계획 초안" title="A3 · 계획 초안"><span class="step-icon" aria-hidden="true">A3</span><span class="rail-link-copy">계획 초안</span><span class="rail-end" aria-hidden="true">↗</span></button>
  </aside>
  <main class="main" id="main-content">
    <header class="page-header">
      <div class="breadcrumb">병원 업무 <span>/</span> 환자 평가 <span>/</span> <strong>A2</strong></div>
      <div class="toolbar"><span class="version-pill">규칙 v0.1</span><button type="button" id="reset" class="btn-quiet">샘플 초기화</button></div>
    </header>
    <div class="page-intro"><div><p class="overline">A2 · 퇴원 전 평가</p><h1>퇴원 후 관리 필요도 평가</h1></div></div>
    <section class="patient-bar" aria-label="가상 환자 선택">
      <div class="patient-lead"><span class="avatar" aria-hidden="true">가</span><div><span class="eyebrow">환자 기록</span><strong id="patient-name"></strong><p id="patient-subtitle"></p></div></div>
      <div class="patient-choose"><label for="patient-select">환자 선택</label><select id="patient-select" aria-label="환자 선택"></select></div>
    </section>
    <section class="judgment-board" aria-labelledby="judgment-title">
      <div class="judgment-top"><div><p class="overline">A2 · 평가 결과</p><h2 id="judgment-title">판단과 우선 확인사항</h2></div></div>
      <div class="judgment-main">
        <div class="judgment-grade"><span class="muted-label">선택한 영역 · <strong id="selected-domain-label">기능</strong></span><div id="side-grade" aria-live="polite"></div><p class="subtle" id="grade-description"></p></div>
        <div class="judgment-actions"><h3>우선 확인할 내용</h3><div id="findings" aria-live="polite"></div></div>
      </div>
      <div class="judgment-stats" aria-label="전체 평가 진행 상태"><span>필수 입력 <strong id="total-complete">—</strong></span><span>판단 보류 <strong id="total-unknown">—</strong></span><span>우선 검토 <strong id="total-priority">—</strong></span></div>
    </section>
    <div class="clinical-grid">
      <section class="domain-column" aria-label="여섯 평가영역">
        <div class="column-label"><h2>평가영역</h2><span>항목 선택</span></div>
        <nav id="domains" class="domain-list" aria-label="평가영역 선택"></nav>
        <div class="method-note"><button type="button" id="show-method" class="text-btn">등급 기준 보기 <span>↗</span></button></div>
      </section>
      <section class="details-column" aria-labelledby="detail-title">
        <div class="column-label"><h2 id="detail-title">영역별 근거 입력</h2><span id="detail-count">—</span></div>
        <article class="form-card">
          <div class="domain-heading"><div><span class="overline" id="domain-kicker">6 DOMAINS</span><h3 id="detail-domain-name">—</h3><p id="detail-domain-hint"></p></div><div id="detail-grade"></div></div>

          <form id="assessment-form" autocomplete="off"></form>
          <details class="form-guidance"><summary>입력 기준·참고사항 보기</summary><div id="field-guidance"></div></details>
          <div class="form-footer"><span id="form-feedback" aria-live="polite">입력값을 변경하면 결과에 반영됩니다.</span><button type="button" id="open-a3-bottom" class="btn-primary">A3 검토 초안 보기 <span>→</span></button></div>
          <div class="integration-actions"><a href="../index.html">통합 시작</a><button type="button" id="integrated-send" class="btn-primary">A3로 실제 평가 인계 →</button><p id="integrated-a2-status" role="status" aria-live="polite"></p></div>
        </article>
      </section>
      <section class="evidence-panel" aria-label="평가 근거 상세">
        <details class="evidence-disclosure"><summary><span>세부 판단 근거·참고자료 보기</span><span class="expand-indicator" aria-hidden="true">⌄</span></summary><div class="evidence-body"><div id="trace"></div><div class="divide"></div><div class="evidence-source"><span>참고한 외부 자료</span><div id="sources"></div></div></div></details>
      </section>
    </div>
  </main>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-inner"><div class="modal-head"><h2 id="modal-title"></h2><button class="close" id="modal-close" aria-label="닫기" type="button">×</button></div><div id="modal-content"></div><div class="modal-footer"><button type="button" id="modal-dismiss" class="btn-primary">확인</button></div></div></dialog>
</body>
</html>
