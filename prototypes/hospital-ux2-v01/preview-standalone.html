function review(){return `<section class="screen">${renderHeading('환자별 업무 / 검토·발행','검토·승인·발행','평가와 안내문을 다시 확인한 후 의료진의 권한에 따라 승인하고 발행하는 단계입니다.')}${patientBanner()}<div class="review-steps"><div class="review-step"><span class="step-number">01 / REVIEW</span><strong>검토 요청</strong><p>작성자가 평가, 계획, 근거, 문서를 정리해 검토를 요청합니다.</p></div><div class="review-step"><span class="step-number">02 / APPROVAL</span><strong>최종 승인</strong><p>지정 최종 승인자가 미해결 사항을 확인하고 승인합니다.</p></div><div class="review-step"><span class="step-number">03 / PUBLICATION</span><strong>발행·전달</strong><p>별도의 발행 절차 이후 승인된 정보만 환자 앱에 표시됩니다.</p></div></div>
 <div class="detail-grid"><section class="table-shell"><div class="panel-pad"><h2 class="section-title">발행 전 확인할 사항</h2><p class="section-caption">항목을 누르면 수정할 화면으로 바로 이동합니다.</p></div><ul class="blockers-list"><li class="blocker-row"><span class="bubble">${icon('alert-circle')}</span><div class="blocker-text"><strong>평가 확인 및 변경사항 인계</strong><p>임시 평가값과 실제 계획 인계는 구분됩니다.</p></div><a href="#/patient/${state.patientId}/assessment" class="inline-link" data-view="assessment">평가 열기 ${icon('arrow-right')}</a></li><li class="blocker-row"><span class="bubble">${icon('file-text')}</span><div class="blocker-text"><strong>환자에게 전달할 안내 검토</strong><p>근거·담당자 확인·환자 공개 여부를 살펴봅니다.</p></div><a href="#/patient/${state.patientId}/plan" class="inline-link" data-view="plan">계획 열기 ${icon('arrow-right')}</a></li><li class="blocker-row"><span class="bubble">${icon('file-check')}</span><div class="blocker-text"><strong>문서·발행 이력 확인</strong><p>PDF 첨부와 승인 상태를 실제 기능에서 확인해야 합니다.</p></div><button class="inline-link" data-action="review-info">절차 설명 ${icon('arrow-right')}</button></li></ul><div class="review-footer"><p>승인·발행은 이 시안에서 실행되지 않습니다.</p><button class="btn btn-primary" data-action="review-info">승인·발행 절차 알아보기 ${icon('arrow-right')}</button></div></section><aside class="surface next-panel"><p class="eyebrow">PROTECTED WORKFLOW</p><h2 class="section-title">환자에게 공개되는 시점은?</h2><p>검토 요청과 승인, 발행은 서로 다른 단계입니다. 실제 시스템에서는 승인되지 않았거나 철회된 내용은 환자 앱에 표시되지 않습니다.</p><div class="readonly-card"><strong>실제 기능은 그대로 보호</strong><br>평가 엔진, 저장, 발행 버전, 개정·철회, 문서 접근 조건 등은 기존 워크벤치에서 유지됩니다.</div><div class="field-caption">시안은 기존 환자앱을 새로 꾸미거나 발행 상태를 조작하지 않습니다.</div></aside></div></section>`;}
function guide(){return `<section class="screen">${renderHeading('사용법 · 시작 안내','처음 사용하는 분을 위한 안내','서비스의 목적과 업무 순서를 이해하고, 예시 환자를 선택해 새 화면을 체험해 보세요.')}${worksteps()}<div class="guide-layout"><section class="surface guide-section"><h2 class="section-title">이렇게 시작하세요</h2>${[
 ['01','환자 목록에서 대상 선택','환자 이름을 검색하고 오른쪽의 다음 업무를 선택하세요. 검색과 환자 선택은 서로 다른 행동입니다.'],
 ['02','필요도 평가 화면에서 항목 확인','6개 영역의 각 5개 항목을 확인하세요. 화면 시안에서는 선택 상태만 바뀝니다.'],
 ['03','퇴원계획 안내 내용 살펴보기','환자에게 보여줄 말과 업무 메타데이터를 구분해 배치했습니다. 문구를 바꾸면 오른쪽 미리보기가 바뀝니다.'],
 ['04','검토·승인·발행 흐름 확인','발행 전에 무엇을 해결해야 하는지, 승인과 발행이 왜 분리되는지 살펴보세요.']
 ].map(s=>`<div class="guide-item"><span class="guide-num">${s[0]}</span><div><strong>${s[1]}</strong><p>${s[2]}</p></div></div>`).join('')}</section><aside class="surface tip-panel"><h2 class="section-title">예시 환자로 바로 시작</h2><p>윤미경(SYN-002) 사례를 선택해 환자 개요부터 평가·계획·검토 화면까지 따라가 보세요.</p><a href="#/patient/SYN-002/overview" class="btn btn-primary" data-open="SYN-002" data-target="overview">SYN-002 체험하기 ${icon('arrow-right')}</a><p class="subtle-note">이 경로는 디자인 시안입니다. 기존 운영용 환자 기록이나 환자 앱에 반영되지 않습니다.</p></aside></div></section>`;}
const views={home,patients,inbox,overview,assessment,plan,review,guide};
const names={home:'업무 홈',patients:'환자 목록',inbox:'검토 업무함',overview:'환자 개요',assessment:'돌봄 필요도 평가',plan:'퇴원계획 작성',review:'검토·승인·발행',guide:'사용법·체험 안내'};
function paintIcons(scope=document){scope.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon)});}
function render({focus=false,keepScroll=false}={}){
 if(!current()&&['overview','assessment','plan','review'].includes(state.view))state.view='patients';
 document.getElementById('main-content').innerHTML=views[state.view]();
 document.getElementById('crumb-current').textContent=names[state.view];
 document.querySelectorAll('.nav-item[data-view]').forEach(el=>{const active=el.dataset.view===state.view;el.classList.toggle('active',active);const disabled=el.classList.contains('patient-route')&&!current();if(disabled){el.setAttribute('aria-disabled','true');el.setAttribute('tabindex','-1');}else{el.removeAttribute('aria-disabled');el.removeAttribute('tabindex');}if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});
 document.getElementById('nav-patient-label').textContent=current()?current().name:'선택 전';
 paintIcons();if(!keepScroll)window.scrollTo({top:0,behavior:'instant'});if(focus)document.getElementById('main-content').focus({preventScroll:true});
}
function closeMenu(){state.menu=false;document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').hidden=true;}
const patientRoutes=['overview','assessment','plan','review'];
function routeFor(view=state.view){return patientRoutes.includes(view)?`#/patient/${state.patientId}/${view}`:`#/${view}`;}
function goto(view){if(!views[view])return;if(patientRoutes.includes(view)&&!current())return;state.view=view;closeMenu();const target=routeFor();if(location.hash!==target)location.hash=target;else render({focus:true});}
function choosePatient(id,target='overview'){if(!people.some(p=>p.id===id))return;state.patientId=id;state.domainId='medical';state.planTab='today';goto(views[target]?target:'overview');}
function syncHash({focus=true}={}){const p=location.hash.replace(/^#\/?/,'').split('/');if(p[0]==='patient'&&people.some(x=>x.id===p[1])){state.patientId=p[1];state.view=patientRoutes.includes(p[2])?p[2]:'overview';}else if(views[p[0]]&&!patientRoutes.includes(p[0])){state.view=p[0];}else state.view='home';closeMenu();render({focus});}
window.addEventListener('hashchange',()=>syncHash());
let toastTimer;
function toast(message){const el=document.getElementById('toast');el.innerHTML=`<div class="toast-message">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.replaceChildren(),3600);}
function dialog(title,body,kicker='설계 시안 안내'){const d=document.getElementById('info-dialog');document.getElementById('dialog-kicker').textContent=kicker;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;d.showModal();}
function doAction(action){
 if(action==='menu-open'){state.menu=true;document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').hidden=false;return;}
 if(action==='menu-close'){closeMenu();return;}
 if(action==='assessment-next'){let i=domains.findIndex(x=>x.id===state.domainId);if(i===domains.length-1)goto('plan');else{state.domainId=domains[i+1].id;render({focus:true})}return;}
 if(action==='review-info'){dialog('실제 승인·발행은 기존 시스템에서 수행합니다.',`<p>UX 2.0 v0.1은 화면과 작업 순서를 검토하는 <strong>독립 프로토타입</strong>입니다. 이 화면에서 검토 요청·승인·발행을 실행하지 않아요.</p><p>기존 시스템은 평가 인계 → 안내·문서 검토 → 검토 요청 → 최종 승인자 승인 → 발행 순서로 동작합니다. 향후 새 화면과 기존 엔진을 연결할 때 동일한 규칙을 유지합니다.</p>`,'기존 기능 보호');return;}
}
document.addEventListener('click',e=>{
 const action=e.target.closest('[data-action]');if(action){e.preventDefault();doAction(action.dataset.action);return;}
 const open=e.target.closest('[data-open]');if(open){e.preventDefault();choosePatient(open.dataset.open,open.dataset.target||'overview');return;}
 const domain=e.target.closest('[data-domain]');if(domain){state.domainId=domain.dataset.domain;render({focus:false,keepScroll:true});return;}
 const tab=e.target.closest('[data-plan-tab]');if(tab){state.planTab=tab.dataset.planTab;render({focus:false,keepScroll:true});return;}
 const view=e.target.closest('[data-view]');if(view){e.preventDefault();goto(view.dataset.view);return;}
});
document.getElementById('scrim').addEventListener('click',closeMenu);
document.addEventListener('change',e=>{
 if(e.target.id==='status-filter'){state.filter=e.target.value;render({keepScroll:true});document.getElementById('status-filter').focus();return;}
 if(e.target.matches('[data-assessment-key]')){const key=e.target.dataset.assessmentKey;state.values[`${state.patientId}.${key}`]=e.target.value;render({keepScroll:true});const target=document.getElementById(`field-${key}`);target?.focus();return;}
});
let searchComposing=false;
document.addEventListener('compositionstart',e=>{if(e.target.id==='patient-search')searchComposing=true;});
document.addEventListener('compositionend',e=>{if(e.target.id!=='patient-search')return;searchComposing=false;state.search=e.target.value;render({keepScroll:true});const search=document.getElementById('patient-search');search?.focus();});
document.addEventListener('input',e=>{
 if(e.target.id==='patient-search'){state.search=e.target.value;if(searchComposing)return;const cursor=e.target.selectionStart;render({keepScroll:true});const search=document.getElementById('patient-search');search?.focus();search?.setSelectionRange(cursor,cursor);return;}
 if(e.target.matches('[data-plan-key]')){const key=`${state.patientId}.${e.target.dataset.planKey}`;state.notes[key]=e.target.value;const preview=document.getElementById('preview-text');if(preview)preview.textContent=e.target.value;return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.menu)closeMenu();});
paintIcons();syncHash({focus:false});


</script>
</body>
</html>
