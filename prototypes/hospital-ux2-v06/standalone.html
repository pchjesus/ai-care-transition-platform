/** Only demonstrates prioritization of manual workflow review; not a validated clinical scale. */
function evaluateDomain(domain, selections) {
  let totalRequired=0,knownRequired=0;
  const missing=[], confusions=[],observed=[], traces=[];
  let peak=0;
  for (const field of domain.fields){
    const value=selections?.[field.id] ?? null;
    if(field.required)totalRequired++;
    if(value==='CONFLICT') {confusions.push(field.label);traces.push({id:`${domain.id}.${field.id}.CONFLICT`,name:field.label,reason:'서로 다른 근거가 상충하여 판단 보류',severity:null});continue;}
    const match=field.options.find(([id])=>id===value);
    if(!match){if(field.required)missing.push(field.label);continue;}
    if(field.required)knownRequired++;
    const tier=match[2];
    peak=Math.max(peak,tier);
    observed.push({label:field.label,value:match[1],tier,required:field.required});
    traces.push({id:`${domain.id}.${field.id}.${value}`,name:field.label,reason:match[1],severity:tier});
  }
  // Social tier 3 reflects multiple confirmed support barriers, not independent living or age alone.
  if(domain.id==='social' && selections?.caregiver==='none' && selections?.housing==='barrier' && selections?.travel==='unavailable'){
    peak=Math.max(peak,3);
    traces.push({id:'social.combination.01',name:'지원 공백 복합 확인',reason:'지원자·주거 장벽·이동 수단 부재가 모두 확인됨',severity:3});
  }
  const uncertain=missing.length>0 || confusions.length>0;
  const status=confusions.length?'CONFLICTING':missing.length?'UNKNOWN':'READY';
  return {domain:domain.id,tier:uncertain?null:peak,provisionalTier:peak,status,missing,confusions,observed,traces,totalRequired,knownRequired,completeness:`${knownRequired}/${totalRequired}`};
}

function domainProgress(d){return d.fields.filter(f=>!!getValue(d.id,f.id)).length;}
function assessment(){
 const d=domains.find(x=>x.id===state.domainId)||domains[0];
 const filled=savedInputCount(),result=reviewResults(state.patientId,state.practice).find(x=>x.domain===d.id);
 const tier=result.tier===null?'판단 보류':CANONICAL.tierLabels[result.tier];
 const notice=state.practice?'원본 A2 규칙으로 임시값을 계산합니다. 저장하거나 계획에 인계하지 않습니다.':'원본 A2 평가값과 업무 검토 우선도를 읽기 전용으로 확인합니다.';
 return `<section class="screen">${renderHeading('환자별 업무 / 평가','돌봄 필요도 평가','원본 6개 영역·30개 항목을 확인합니다. 변경을 연습하려면 임시 입력 체험을 선택하세요.')}
 ${patientBanner()}
 <div class="assessment-toolbar"><div class="source-inline">${icon('info')}<span>${esc(source.notice)} · ${esc(notice)}</span></div>
 <div class="ui-control-line" role="group" aria-label="평가 화면 도구">
  <button type="button" class="btn ${state.practice?'btn-soft':''}" data-action="practice-toggle" aria-pressed="${state.practice}">${state.practice?'임시 실습 종료':'임시 입력 체험'}</button>
  <button type="button" class="btn" data-action="panel-toggle" aria-expanded="${state.resultOpen}" aria-controls="assessment-result">${state.resultOpen?'결과 패널 접기':'결과 패널 펼치기'}</button>
 </div></div>
 <div class="assessment-grid ${state.resultOpen?'has-results':'no-results'}">
  <nav class="surface domain-list" aria-label="평가 영역">${domains.map((x,i)=>{
   const r=reviewResults(state.patientId,state.practice).find(y=>y.domain===x.id);
   return `<button type="button" class="domain-btn ${x.id===d.id?'active':''}" data-domain="${x.id}" aria-current="${x.id===d.id?'true':'false'}"><span class="domain-badge">${String(i+1).padStart(2,'0')}</span><span class="domain-label"><strong>${esc(x.name)}</strong><small>${esc(x.sub)}</small></span><span class="domain-progress">${r.knownRequired}/${r.totalRequired}</span></button>`;
  }).join('')}</nav>
  <section class="surface assessment-main"><div class="assessment-header"><div><h2 class="section-title">${esc(d.name)} 영역</h2><p class="section-caption">원본 평가 항목 · ${state.practice?'현재 탭에서 임시 선택':'입력값 확인 전용'}</p></div><span class="required-count">필수 ${result.knownRequired} / ${result.totalRequired}</span></div>
  <div class="question-list">${d.fields.map((f,i)=>{
   const value=getValue(d.id,f.id);
   return `<div class="question"><div><label for="field-${esc(f.id)}">${esc(f.label)} ${f.required?'<span class="required-mark">필수</span>':''}</label><small>항목 ${i+1}/${d.fields.length}</small></div>
   <select id="field-${esc(f.id)}" data-assessment-domain="${esc(d.id)}" data-assessment-key="${esc(f.id)}" ${state.practice?'':'disabled aria-label="읽기 전용 값"'}>
   <option value="" ${!value?'selected':''}>미평가</option>${f.options.map(([key,label])=>`<option value="${esc(key)}" ${value===key?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`;
  }).join('')}</div>
  <div class="assessment-footer"><p>이 결과는 업무 검토 우선도이며 임상 위험도·퇴원 허가 판정이 아닙니다.</p><button class="btn btn-primary" data-action="assessment-next">${d.id==='continuity'?'계획 작성 화면으로':'다음 평가 영역'} ${icon('arrow-right')}</button></div></section>
  <aside id="assessment-result" class="surface assessment-results" ${state.resultOpen?'':'hidden'} aria-label="영역 평가 결과"><p class="eyebrow">${state.practice?'임시 평가 결과':'원본 A2 평가 결과'}</p><h2 class="section-title">${esc(d.name)} · 평가 상태</h2>
   <div class="result-kpi"><span class="result-tag ${result.status==='READY'?'ok':'warning'}">${result.status==='READY'?'필수항목 확인':result.status==='CONFLICTING'?'상충 확인 필요':'필수값 미평가'}</span><strong>${esc(tier)}</strong></div>
   <p class="small-muted">업무 검토 우선도 · 임상 위험도 아님</p><div class="result-detail"><strong>필수 입력 ${result.knownRequired}/${result.totalRequired}</strong><div class="mini-progress"><span style="width:${result.totalRequired?Math.round(100*result.knownRequired/result.totalRequired):0}%"></span></div></div>
   ${result.missing.length?`<div class="result-items"><strong>미평가 항목</strong><ul>${result.missing.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
   ${result.confusions.length?`<div class="result-items"><strong>상충 항목</strong><ul>${result.confusions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
   ${!result.missing.length&&!result.confusions.length?'<p class="result-ok">필수 항목에 미평가·상충이 없습니다.</p>':''}
   <p class="result-note">현재 화면에서는 저장·인계·승인·발행을 실행하지 않습니다.</p></aside></div>
 <div class="original-workflow">${originalLink('assessment','기존 업무 화면에서 평가·저장·인계하기')}<p>새 탭에서 기존 의료진 워크벤치가 열립니다. 이 시안에서 실습한 임시 선택값은 전달되지 않습니다.</p></div><p class="foot-note">값이 있는 항목 ${filled}/30 · ${esc(notice)}</p></section>`;
}

function review(){
 const r=record(state.patientId),draft=r?.draft||{};
 const issues=Array.isArray(draft.issues)?draft.issues.filter(x=>x.status!=='RESOLVED'):[];
 const docs=Array.isArray(draft.docs)?draft.docs:[];
 const publications=Array.isArray(r?.publications)?r.publications:[];
 const active=publications.find(x=>x.status==='PUBLISHED');
 const assessmentResults=reviewResults(state.patientId,false),incomplete=assessmentResults.filter(x=>x.status!=='READY');
 const dirty=!!r?.a2Dirty;
 const status=PLAN_STATES[draft.status]||'상태 확인 필요';
 const assessmentSummary=dirty?'변경된 평가의 A3 인계가 필요합니다.':incomplete.length?`${incomplete.length}개 영역에 필수값 누락 또는 상충이 있습니다.`:'A2 필수 항목의 누락·상충이 없습니다.';
 const issueSummary=issues.length?`${issues.length}개 미해결 항목이 기록되어 있습니다.`:'기록상 미해결 검토 항목이 없습니다.';
 const issuePreview=issues.length?`<ul>${issues.slice(0,3).map(x=>`<li>${esc(x.title)}</li>`).join('')}${issues.length>3?'<li>그 외 항목은 기존 업무 화면에서 확인</li>':''}</ul>`:'';
 const pubLabel=active?`발행 v${esc(active.snapshot?.planVersion||'버전 확인 필요')} · 환자 공개 중`:'현재 공개 중인 발행본 없음';
 return `<section class="screen">${renderHeading('환자별 업무 / 검토·발행','검토·승인·발행','원본 A3 기록을 읽어 현재 상태를 확인합니다. 승인이나 발행은 기존 업무 화면에서 수행합니다.')}${patientBanner()}
 <div class="review-state">${statBadge(status,draft.status==='PUBLISHED'?'green':draft.status==='REVOKED'?'red':'blue')}<span class="review-counter">현재 발행본: ${pubLabel}</span></div>
 <div class="review-steps"><div class="review-step"><span class="step-number">01 / REVIEW</span><strong>검토 요청</strong><p>작성자가 평가, 계획, 근거, 문서를 정리해 검토를 요청합니다.</p></div><div class="review-step"><span class="step-number">02 / APPROVAL</span><strong>최종 승인</strong><p>지정 최종 승인자가 미해결 사항을 확인하고 승인합니다.</p></div><div class="review-step"><span class="step-number">03 / PUBLICATION</span><strong>발행·전달</strong><p>별도의 발행 절차 이후 승인된 정보만 환자 앱에 표시됩니다.</p></div></div>
 <div class="detail-grid"><section class="table-shell"><div class="panel-pad"><h2 class="section-title">현재 확인할 업무</h2><p class="section-caption">원본 기록의 참고 정보입니다. 최종 발행 가능 여부는 기존 A3에서만 판정합니다.</p></div><ul class="blockers-list">
 <li class="blocker-row"><span class="bubble">${icon('clipboard-list')}</span><div class="blocker-text"><strong>평가 상태·인계 확인</strong><p>${esc(assessmentSummary)}</p></div><a href="#/patient/${state.patientId}/assessment" class="inline-link" data-view="assessment">평가 열기 ${icon('arrow-right')}</a></li>
 <li class="blocker-row"><span class="bubble">${icon('alert-circle')}</span><div class="blocker-text"><strong>계획 검토 기록</strong><p>${esc(issueSummary)}</p><div class="review-blocker-details">${issuePreview}</div></div>${originalLink('plan','기존 A3에서 처리')}</li>
 <li class="blocker-row"><span class="bubble">${icon('file-check')}</span><div class="blocker-text"><strong>문서·발행 이력</strong><p>문서 ${docs.length}개 · 발행 기록 ${publications.length}건 · ${pubLabel}</p></div><button class="inline-link" data-action="review-info">절차 설명 ${icon('arrow-right')}</button></li></ul>
 <div class="review-footer"><p>원본 업무 규칙·의료진 역할·발행 전 차단 조건은 기존 시스템에서 확인합니다.</p>${originalLink('plan','기존 A3 업무 이어서 진행')}</div></section>
 <aside class="surface next-panel"><p class="eyebrow">READ ONLY</p><h2 class="section-title">현재 계획 · ${esc(status)}</h2><p>이 화면은 A3 합성 기록의 상태와 일부 정보를 읽습니다. 첨부 파일 원본, 원천자료 검증, 최종 승인 조건을 대신 판단하지 않습니다.</p><div class="readonly-card"><strong>${pubLabel}</strong><br>변경 중인 초안과 이미 발행된 버전은 별개로 관리됩니다. 승인되지 않은 변경내용을 환자에게 공개하지 않습니다.</div><div class="original-workflow">${originalLink('plan','원본 검토·승인·발행 화면 열기')}<p>외부 브라우저 탭에서 기존 시연 앱을 엽니다. 로컬 HTML과 브라우저의 저장 데이터는 자동 동기화되지 않습니다.</p></div></aside></div></section>`;
}
function guide(){return `<section class="screen">${renderHeading('사용법 · 시작 안내','처음 사용하는 분을 위한 안내','서비스의 목적과 업무 순서를 이해하고, 예시 환자를 선택해 새 화면을 체험해 보세요.')}${worksteps()}<div class="guide-layout"><section class="surface guide-section"><h2 class="section-title">이렇게 시작하세요</h2>${[

// Keep the active input node intact while filtering; this also protects Korean IME composition.
function refreshPatientResults(){
 if(state.view!=='patients')return;
 const currentRows=document.querySelector('.data-table tbody');
 if(!currentRows)return;
 const fragment=document.createElement('template');
 fragment.innerHTML=patients();
 const nextRows=fragment.content.querySelector('.data-table tbody');
 if(nextRows)currentRows.replaceChildren(...nextRows.children);
}
const views={home,patients,inbox,overview,assessment,plan,review,guide};
const names={home:'업무 홈',patients:'환자 목록',inbox:'검토 업무함',overview:'환자 개요',assessment:'돌봄 필요도 평가',plan:'퇴원계획 작성',review:'검토·승인·발행',guide:'사용법·체험 안내'};
function paintIcons(scope=document){scope.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon)});}
function render({focus=false,keepScroll=false,routeTransition=false}={}){
 if(!current()&&['overview','assessment','plan','review'].includes(state.view))state.view='patients';
 const main=document.getElementById('main-content');
 main.innerHTML=views[state.view]();
 if(routeTransition)main.querySelector('.screen')?.classList.add('page-enter');
 document.getElementById('crumb-current').textContent=names[state.view];
 document.querySelectorAll('.nav-item[data-view]').forEach(el=>{const active=el.dataset.view===state.view;el.classList.toggle('active',active);const disabled=el.classList.contains('patient-route')&&!current();if(disabled){el.setAttribute('aria-disabled','true');el.setAttribute('tabindex','-1');}else{el.removeAttribute('aria-disabled');el.removeAttribute('tabindex');}if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});
 document.getElementById('nav-patient-label').textContent=current()?current().name:'선택 전';
 document.querySelector('.prototype-pill') .textContent='UX 2.0 v0.5 · '+(source.mode==='saved'?'기존 기록 읽기':'원본 사례');
 paintIcons();if(!keepScroll)window.scrollTo({top:0,behavior:'instant'});if(focus)document.getElementById('main-content').focus({preventScroll:true});
}
function closeMenu(){state.menu=false;document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').hidden=true;}
const patientRoutes=['overview','assessment','plan','review'];
function routeFor(view=state.view){return patientRoutes.includes(view)?`#/patient/${state.patientId}/${view}`:`#/${view}`;}
function goto(view){if(!views[view])return;if(patientRoutes.includes(view)&&!current())return;state.view=view;closeMenu();const target=routeFor();if(location.hash!==target)location.hash=target;else render({focus:true,routeTransition:true});}
function choosePatient(id,target='overview'){if(!people.some(p=>p.id===id))return;state.patientId=id;state.domainId='medical';state.planTab='today';state.practice=false;state.values={};goto(views[target]?target:'overview');}
function syncHash({focus=true,routeTransition=false}={}){const p=location.hash.replace(/^#\/?/,'').split('/');if(p[0]==='patient'&&people.some(x=>x.id===p[1])){state.patientId=p[1];state.view=patientRoutes.includes(p[2])?p[2]:'overview';}else if(views[p[0]]&&!patientRoutes.includes(p[0])){state.view=p[0];}else state.view='home';closeMenu();render({focus,routeTransition});}
window.addEventListener('hashchange',()=>syncHash({routeTransition:true}));
let toastTimer;
function toast(message){const el=document.getElementById('toast');el.innerHTML=`<div class="toast-message">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.replaceChildren(),3600);}
function dialog(title,body,kicker='설계 시안 안내'){const d=document.getElementById('info-dialog');document.getElementById('dialog-kicker').textContent=kicker;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;d.showModal();}
function doAction(action){
 if(action==='density-toggle'){state.density=state.density==='normal'?'compact':'normal';render({keepScroll:true});return;}
 if(action==='panel-toggle'){state.resultOpen=!state.resultOpen;render({keepScroll:true});return;}
 if(action==='plan-split'||action==='plan-focus'){state.planLayout=action==='plan-focus'?'focus':'split';render({keepScroll:true});return;}
 if(action==='practice-toggle'){state.practice=!state.practice;state.values={};render({keepScroll:true});return;}
 if(action==='source-refresh'){refreshSource();render({keepScroll:true});toast(source.notice);return;}

 if(action==='menu-open'){state.menu=true;document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').hidden=false;return;}
 if(action==='menu-close'){closeMenu();return;}
 if(action==='assessment-next'){let i=domains.findIndex(x=>x.id===state.domainId);if(i===domains.length-1)goto('plan');else{state.domainId=domains[i+1].id;render({focus:true})}return;}
 if(action==='review-info'){dialog('실제 승인·발행은 기존 시스템에서 수행합니다.',`<p>UX 2.0 v0.5는 A2 평가 입력·저장·인계를 원본 평가 함수에 연결했습니다. A3의 검토 요청·승인·발행은 여전히 기존 시스템에서 수행합니다.</p><p>기존 시스템은 평가 인계 → 안내·문서 검토 → 검토 요청 → 최종 승인자 승인 → 발행 순서로 동작합니다. 새 화면에서도 승인·발행 안전 규칙은 기존 엔진에서만 처리합니다.</p>`,'기존 기능 보호');return;}
}
document.addEventListener('click',e=>{
 const action=e.target.closest('[data-action]');if(action){e.preventDefault();doAction(action.dataset.action);return;}
 const open=e.target.closest('[data-open]');if(open){e.preventDefault();choosePatient(open.dataset.open,open.dataset.target||'overview');return;}
 const domain=e.target.closest('[data-domain]');if(domain){state.domainId=domain.dataset.domain;render({focus:false,keepScroll:true});document.querySelector(`[data-domain="${state.domainId}"]`)?.focus({preventScroll:true});return;}
 const tab=e.target.closest('[data-plan-tab]');if(tab){state.planTab=tab.dataset.planTab;render({focus:false,keepScroll:true});document.querySelector(`[data-plan-tab="${state.planTab}"]`)?.focus({preventScroll:true});return;}
 const view=e.target.closest('[data-view]');if(view){e.preventDefault();goto(view.dataset.view);return;}
});
document.getElementById('scrim').addEventListener('click',closeMenu);
document.addEventListener('change',e=>{
 if(e.target.id==='status-filter'){state.filter=e.target.value;render({keepScroll:true});document.getElementById('status-filter').focus();return;}
 if(e.target.matches('[data-assessment-key]')){const key=e.target.dataset.assessmentKey;if(!state.practice)return;state.values[`${state.patientId}.${e.target.dataset.assessmentDomain}.${key}`]=e.target.value;render({keepScroll:true});const target=document.getElementById(`field-${key}`);target?.focus();return;}
});
let searchComposing=false;
document.addEventListener('compositionstart',e=>{if(e.target.id==='patient-search')searchComposing=true;});
document.addEventListener('compositionend',e=>{if(e.target.id!=='patient-search')return;searchComposing=false;state.search=e.target.value;refreshPatientResults();});
document.addEventListener('input',e=>{
 if(e.target.id==='patient-search'){state.search=e.target.value;if(!searchComposing)refreshPatientResults();return;}
 if(e.target.matches('[data-plan-key]')){const key=`${state.patientId}.${e.target.dataset.planKey}`;state.notes[key]=e.target.value;const preview=document.getElementById('preview-text');if(preview)preview.textContent=e.target.value;return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.menu)closeMenu();});
paintIcons();syncHash({focus:false});



</script>

ownRequired,completeness:`${knownRequired}/${totalRequired}`};\n}\nexport function evaluateAll(values){return DOMAINS.map(d=>evaluateDomain(d,values[d.id]||{}));}\nexport function chooseAction(domainId, tier){\n  const map={\n    medical:{title:'진료·추적계획 확인',detail:'담당 의료진에게 미확정 진료·결과 확인을 요청',category:'의료'},\n    nursing:{title:'자가간호 교육 검토',detail:'필요한 교육 내용을 확인하고 쉬운 안내를 작성',category:'간호'},\n    medication:{title:'퇴원약 조정 확인',detail:'약물 목록 대조와 복약 안내를 처방권자·약사와 검토',category:'약료'},\n    function:{title:'이동·일상생활 지원 검토',detail:'이동 보조·ADL 관련 교육과 필요한 지원 논의',category:'기능'},\n    social:{title:'가정 복귀 지원 검토',detail:'실제 지원 가능 인력·이동·주거 장벽 확인',category:'사회환경'},\n    continuity:{title:'후속관리·연락체계 정리',detail:'확정된 방문 일정과 문의처를 환자에게 전달',category:'연속성'}\n  };\n  if(tier===0)return null;\n  return map[domainId];\n}\nexport const TIER_LABELS=['추가 지원 미확인','일반 안내 검토','추가 지원 검토','퇴원 전 우선 검토'];\n","shared/assessment-adapter.js":"// A2 v0.5 is the only scoring authority. This adapter only renames presentation fields.\nimport {DOMAINS} from '../a2/data.js';\nimport {evaluateAll} from '../a2/engine.js';\nexport function evaluateForReview(values={}) {\n return evaluateAll(values).map((result,i)=>{\n  const domain=DOMAINS[i];\n  return {id:result.domain,title:domain.title,status:result.status,grade:result.tier,\n   provisionalGrade:result.provisionalTier,requiredDone:result.knownRequired,\n   requiredTotal:result.totalRequired,missing:result.missing,conflicting:result.confusions,\n   traces:result.traces,\n   facts:result.observed.map(fact=>{\n    const field=domain.fields.find(field=>field.label===fact.label);\n    return {...fact,id:field.id,raw:values[domain.id]?.[field.id]};\n   })};\n });\n}\nexport const REVIEW_DOMAINS=DOMAINS.map(d=>({...d,\n fields:d.fields.map(f=>[f.id,f.label,Number(f.required),f.options])}));\n","a3/data.js":"import {REVIEW_DOMAINS} from '../shared/assessment-adapter.js';\nexport const DOMAINS=REVIEW_DOMAINS;\nexport const CASES=[\n {id:'SYN-001',name:'이정희',age:75,contex   }
  function reviewV6() {
    const r=getRecord(), d=r.draft, available=new Set(ui.files.keys());
    const blocking=workflow.blockers(r,available);
    const currentPublication=workflow.currentPublished(r);
    return `<section class="screen">${renderHeading('환자별 업무 / 검토·발행','검토·승인·발행 상태','기존 A3의 발행 차단 규칙을 그대로 계산하여 미해결 사유와 기록을 확인합니다. 이 버전에서는 발행·개정·철회를 수행하지 않습니다.')}
      ${patientBanner()}${accessLine(r)}
      <div class="review-state">${statBadge(PLAN_STATES[d.status]||d.status,d.status==='PUBLISHED'?'green':'blue')}
        <span class="review-counter">초안 ${esc(d.version)} · 현재 공개 중인 발행본: ${currentPublication?'v'+esc(currentPublication.snapshot.planVersion):'없음'}</span></div>
      <div class="ux6-review-grid"><section class="surface ux6-card"><h2 class="section-title">발행 전 확인 사항 · ${blocking.length}건</h2>
        ${blocking.length?`<ul class="ux6-blockers">${blocking.map(b=>`<li><strong>${esc(b.group||'확인')}</strong><span>${esc(b.label)}</span></li>`).join('')}</ul>`:'<p class="ux6-empty">현재 탭에 연결된 PDF까지 포함해 차단 사유가 없습니다. 최종 역할·승인은 별도 원본 A3에서 확인합니다.</p>'}
        <div class="ux6-actions"><button type="button" class="btn" data-view="assessment">A2 평가 확인</button><button type="button" class="btn" data-view="plan">계획·문서 수정</button></div>
      </section><aside class="surface ux6-card"><h2 class="section-title">계획 및 발행 이력</h2>
        <p>승인 기록: ${d.approval?esc(d.approval.role)+' · '+esc(dateLabel(d.approval.at)):'없음'}</p>
        <p>변경 이력 ${r.audit.length}건 · 발행 기록 ${r.publications.length}건</p>
        <details><summary>변경 이력 보기</summary><ol class="ux6-history">${r.audit.slice(0,30).map(x=>`<li><b>${esc(x.event)}</b> · ${esc(x.role)}<small>${esc(dateLabel(x.at))} · ${esc(x.details)}</small></li>`).join('')}</ol></details>
        <a class="btn btn-primary" href="${esc(new URL('../integrated-v10/a3/index.html?screen=plan&patient='+encodeURIComponent(state.patientId),location.href).href)}" target="_blank" rel="noopener noreferrer">원본 A3에서 후속 승인 업무 진행 ${icon('arrow-up-right')}</a>
        <p class="small-muted">의료진 역할은 시연용입니다. 승인·발행은 자동으로 이뤄지지 않습니다.</p>
      </aside></div>
    </section>`;
  }
  function commit(mutator, event, description) {
    const id=state.patientId, beforeSeen=ui.seen, person=CANONICAL.cases.find(c=>c.id===id);
    if(!person || !writable()){toast('저장할 수 없습니다. 현재 기록을 확인하세요.');return false;}
    try {
      const box=storage.loadRepository(localStorage,key);
      if(box.error){ui.stale=true;throw Error('기존 합성 저장자료가 손상되어 저장을 중지했습니다.');}
      if(box.serialized!==beforeSeen){ui.stale=true;throw Error('다른 탭에서 기록이 수정되었습니다. 새로고침 후 다시 확인하세요.');}
      storage.initializePatients(box.records);
      const prev=box.records[id];
      if(!prev || !editable(prev))throw Error('발행되거나 철회된 계획은 개정 전 편집할 수 없습니다.');
      const copy=workflow.deepCopy(prev);
      const changed=mutator(copy);
      if(changed===false)return false;
      if(['APPROVED','REVIEW_REQUESTED','CHANGES_REQUESTED'].includes(copy.draft.status)){
        copy.draft.status='DRAFT';
        copy.draft.approval=null;
        workflow.audit(copy,ui.role,'APPROVAL_INVALIDATED','계획·근거·문서 변경으로 재검토 필요');
      }
      workflow.audit(copy,ui.role,event,description);
      box.records[id]=copy;
      try{storage.persistRepository(localStorage,key,box);}catch(error){ui.stale=true;throw error;}
      ui.stale=false;
      refreshSource();
      render({keepScroll:true});
      toast('합성 기록 저장 완료 · 승인/발행 상태를 확인하세요.');
      return true;
    } catch(error) {
      toast('저장 거부 · 원본 보존: '+(error.message||'오류'));
      render({keepScroll:true});
      return false;
    }
  }
  function targetItem() { return getRecord()?.draft.items.find(i=>i.id===state.planTab)||getRecord()?.draft.items[0]; }
  function saveText() {
    const item=targetItem(), text=document.getElementById('ux6-plan-text')?.value;
    if(!item || typeof text!=='string')return;
    if(text===item.text){toast('변경된 내용이 없습니다.');return;}
    commit(r=>{const x=r.draft.items.find(i=>i.id===item.id);x.text=text;x.verified=false;},'PLAN_EDIT',item.title+' · 안내문');
  }
  function linkSource(id,remove=false) {
    const item=targetItem();if(!item || !id)return;
    commit(r=>{
      const x=r.draft.items.find(i=>i.id===item.id), existing=linked(x);
      if(remove&&!existing.includes(id))return false;
      if(!remove && (existing.includes(id)||existing.length>=12))throw Error('이미 연결된 기록이거나 근거 최대 12건을 초과했습니다.');
      if(!remove && !library.usableSource(library.findSource(id,state.patientId,r.unlockedSources||[]),'item',x.section,state.patientId))throw Error('환자·입원건·검토 항목에 맞는 확인 자료가 아닙니다.');
      const next=remove?existing.filter(s=>s!==id):[...existing,id];
      if(next.length)x.sources=next;else delete x.sources;
      x.source=next[0]||''; x.verified=false;
    },remove?'EVIDENCE_UNLINKED':'EVIDENCE_LINKED',item.title+' · '+id);
  }
  function saveAppointment() {
    const item=targetItem();if(!item||item.section!=='followup')return;
    const fields={};
    for(const x of document.querySelectorAll('[data-v6-appointment]')) fields[x.dataset.v6Appointment]=x.value;
    commit(r=>{
      const x=r.draft.items.find(i=>i.id===item.id);
      const next={status:fields.status,date:fields.date,time:fields.time,place:fields.place,
        ...(x.appointment?.destination?{destination:x.appointment.destination}:{})};
      if(!workflow.validAppointment(next))throw Error('가상 확정 일정에는 유효한 날짜·시간·장소가 필요합니다.');
      x.appointment=next;x.verified=false;
    },'SYNTHETIC_APPOINTMENT_EDIT','가상 외래 일정 수정 · 재검토 필요');
  }
  function verify() {
    const item=targetItem(), checked=document.querySelector('[data-v6-verified]')?.checked;
    if(!item)return;
    commit(r=>{
      const x=r.draft.items.find(i=>i.id===item.id);
      if(checked && !itemPermitted(x.section))throw Error('해당 항목을 확인할 담당 역할이 아닙니다.');
      if(checked && (!x.text.trim()||!workflow.validItemSources(r,x)))throw Error('안내문과 해당 항목에 맞는 확인 자료가 필요합니다.');
      x.verified=!!checked;
    },'PLAN_EDIT',item.title+' · 직종 검토 변경');
  }
  function setVisibility(value) {
    const item=targetItem();
    if(!item||!['PATIENT','INTERNAL'].includes(value))return;
    commit(r=>{
      const x=r.draft.items.find(i=>i.id===item.id);
      if(x.visibility===value)return false;
      x.visibility=value;x.verified=false;
    },'PLAN_EDIT',item.title+' · 공개 범위 변경');
  }
  function resolveIssue(box) {
    const id=box?.dataset.v6Issue;
    const sourceId=box?.querySelector('[data-v6-issue-source]')?.value;
    const resolution=box?.querySelector('[data-v6-resolution]')?.value.trim()||'';
    if(!id)return;
    commit(r=>{
      const x=r.draft.issues.find(i=>i.id===id);
      if(!x||x.status==='RESOLVED')throw Error('이미 해결되었거나 존재하지 않는 검토 항목입니다.');
      if(!issuePermitted(x.domain))throw Error('이 영역의 근거를 확인할 담당 역할이 아닙니다.');
      if(!library.usableSource(library.findSource(sourceId,state.patientId,r.unlockedSources||[]),'issue',x,state.patientId)||resolution.length<10)
        throw Error('해당 문제에 맞는 원천자료와 10자 이상의 확인 기록이 필요합니다.');
      x.source=sourceId;x.resolution=resolution;x.reviewer=roles[ui.role];x.status='RESOLVED';
    },'ISSUE_RESOLVED',id+' · 근거 확인');
  }
  function changeDoc(target, field) {
    const root=target.closest('[data-v6-doc]'), id=root?.dataset.v6Doc;
    const value=target.value;
    if(!id)return;
    commit(r=>{
      const d=r.draft.docs.find(x=>x.id===id);
      if(!d)throw Error('문서가 없습니다.');
      if(field==='visibility'){if(!['INTERNAL','PATIENT'].includes(value))throw Error('공개 범위 오류');d.visibility=value;}
      if(field==='category'){if(!['GENERAL','MEDICATION'].includes(value))throw Error('분류 오류');d.category=value;}
      d.status='REGISTERED';
    },'PDF_EDIT',id+' · 공개 범위/분류');
  }
  function docAction(target,action) {
    const id=target.closest('[data-v6-doc]')?.dataset.v6Doc;
    if(!id)return;
    if(action==='open-pdf'){
      const file=ui.files.get(id);
      if(!file){toast('PDF 원본을 다시 첨부하세요.');return;}
      const u=URL.createObjectURL(file);
      const opened=window.open(u,'_blank','noopener,noreferrer');
      if(!opened)toast('팝업이 차단되었을 수 있습니다.');
      setTimeout(()=>URL.revokeObjectURL(u),60000);
      return;
    }
    if(action==='review-pdf' && !['PHYSICIAN','APPROVER'].includes(ui.role)){toast('문서 검토는 담당 의사·최종 승인자 역할에서 가능합니다.');return;}
    if(action==='review-pdf' && !ui.files.has(id)){toast('PDF 원본을 다시 첨부해야 합니다.');return;}
    const done=commit(r=>{
      const d=r.draft.docs.find(x=>x.id===id);if(!d)throw Error('문서가 없습니다.');
      if(action==='review-pdf')d.status='REVIEWED';
      if(action==='remove-pdf')r.draft.docs=r.draft.docs.filter(x=>x.id!==id);
    },action==='review-pdf'?'PDF_REVIEWED':'PDF_REMOVED',id);
    if(done && action==='remove-pdf')ui.files.delete(id);
  }
  async function attachPdf(file) {
    if(!file)return;
    const id=state.patientId, stamp=ui.seen;
    if(!writable()||!editable(getRecord())){toast('현재 계획에는 첨부할 수 없습니다.');return;}
    try {
      if(!file.name.toLowerCase().endsWith('.pdf')||file.size>4*1024*1024||file.size<5)throw Error('4MB 이하 PDF만 첨부 가능합니다.');
      if(!crypto.subtle)throw Error('SHA-256을 사용할 수 없는 환경입니다.');
      const buffer=await file.arrayBuffer();
      if(new TextDecoder().decode(buffer.slice(0,5))!=='%PDF-')throw Error('PDF 원본의 형식이 올바르지 않습니다.');
      const digest=await crypto.subtle.digest('SHA-256',buffer);
      const hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
      if(id!==state.patientId||stamp!==ui.seen||!editable(getRecord()))throw Error('검사 중 선택 환자나 기록이 변경됐습니다.');
      const existing=getRecord().draft.docs.find(d=>d.name===file.name&&d.size===file.size&&d.fileHash===hash);
      if(existing){ui.files.set(existing.id,file);render({keepScroll:true});toast('동일한 PDF 원본을 다시 연결했습니다.');return;}
      const documentId='DOC-'+Date.now()+'-'+Math.round(Math.random()*99999);
      if(commit(r=>{r.draft.docs.push({id:documentId,name:file.name,size:file.size,fileHash:hash,visibility:'INTERNAL',status:'REGISTERED',at:workflow.now()});},'PDF_ATTACHED',file.name)){
        ui.files.set(documentId,file);
        render({keepScroll:true});
      }
    }catch(error){toast('문서 첨부 보류: '+error.message);}
  }
  views.plan=planV6;
  views.review=reviewV6;
  const priorRender=render;
  render=function(opts){
    if(ui.lastPatient!==state.patientId){
      ui.lastPatient=state.patientId;
      ui.tab='items';
      ui.files.clear(); // Never carry session PDF bytes into a different patient.
    }
    priorRender(opts);
    const snapshot=storage.loadRepository(localStorage,key);
    ui.seen=snapshot.serialized;
    if(snapshot.error)ui.stale=true;
    const pill=document.querySelector('.prototype-pill');
    if(pill)pill.textContent='UX 2.0 v0.6 · 합성 데이터';
  };
  // The original hash-based navigation renders asynchronously. Show authoring/review
  // routes immediately so rapid patient switches never leave the previous screen visible.
  const priorGoto=goto;
  goto=function(view){
    priorGoto(view);
    if((view==='plan'||view==='review')&&state.view===view)render({focus:false,routeTransition:true});
  };
  document.addEventListener('click',e=>{
    const tab=e.target.closest('[data-v6-tab]');
    if(tab){e.preventDefault();e.stopImmediatePropagation();ui.tab=tab.dataset.v6Tab;render({keepScroll:true});return;}
    const action=e.target.closest('[data-v6-action]');
    if(!action)return;
    e.preventDefault();e.stopImmediatePropagation();
    const name=action.dataset.v6Action;
    if(name==='save-text')saveText();
    else if(name==='save-appointment')saveAppointment();
    else if(name==='link')linkSource(document.getElementById('ux6-add-source')?.value);
    else if(name==='unlink')linkSource(action.dataset.v6Id,true);
    else if(name==='resolve')resolveIssue(action.closest('[data-v6-issue]'));
    else if(['open-pdf','review-pdf','remove-pdf'].includes(name))docAction(action,name);
  },true);
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.matches('[data-v6-role]')){e.stopImmediatePropagation();ui.role=t.value;render({keepScroll:true});return;}
    if(t.matches('[data-v6-verified]')){e.stopImmediatePropagation();verify();return;}
    if(t.matches('[data-v6-visibility]')){e.stopImmediatePropagation();setVisibility(t.value);return;}
    if(t.matches('[data-v6-doc-visibility]')){e.stopImmediatePropagation();changeDoc(t,'visibility');return;}
    if(t.matches('[data-v6-doc-category]')){e.stopImmediatePropagation();changeDoc(t,'category');return;}
    if(t.matches('[data-v6-pdf]')){e.stopImmediatePropagation();attachPdf(t.files?.[0]);}
  },true);
  document.addEventListener('input',e=>{
    if(e.target.matches('[data-v6-text]')){
      const preview=document.getElementById('ux6-preview-text');
      if(preview)preview.textContent=e.target.value;
    }
  },true);
  window.addEventListener('storage',event=>{
    if(event.key===key){ui.stale=true;toast('다른 탭에서 합성 기록이 변경되었습니다. 새로고침 후 편집하세요.');}
  });
  render({keepScroll:true});
})();

</script>
