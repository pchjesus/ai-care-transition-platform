/** Only demonstrates prioritization of manual workflow review; not a validated clinical scale. */
function evaluateDomain(domain, selections) {
  let totalRequired=0,knownRequired=0;
  const missing=[], confusions=[],observed=[], traces=[];
  let peak=0;
  for (const field of domain.fields){
    const value=selections?.[field.id] ?? null;
    if(field.required)totalRequired++;
    if(value==='CONFLICT') {confusions.push(field.label);traces.push({id:`${domain.id}.${field.id}.CONFLICT`,name:field.label,reason:'서로 다른 근거가 상충하여 판단 보류',severity:null});continue;}
    const match=field.options.find(([id])=>id===value);
    if(!match){if(field.required)missing.push(field.label);continue;}
    if(field.required)knownRequired++;
    const tier=match[2];
    peak=Math.max(peak,tier);
    observed.push({label:field.label,value:match[1],tier,required:field.required});
    traces.push({id:`${domain.id}.${field.id}.${value}`,name:field.label,reason:match[1],severity:tier});
  }
  // Social tier 3 reflects multiple confirmed support barriers, not independent living or age alone.
  if(domain.id==='social' && selections?.caregiver==='none' && selections?.housing==='barrier' && selections?.travel==='unavailable'){
    peak=Math.max(peak,3);
    traces.push({id:'social.combination.01',name:'지원 공백 복합 확인',reason:'지원자·주거 장벽·이동 수단 부재가 모두 확인됨',severity:3});
  }
  const uncertain=missing.length>0 || confusions.length>0;
  const status=confusions.length?'CONFLICTING':missing.length?'UNKNOWN':'READY';
  return {domain:domain.id,tier:uncertain?null:peak,provisionalTier:peak,status,missing,confusions,observed,traces,totalRequired,knownRequired,completeness:`${knownRequired}/${totalRequired}`};
}

 !!r.assessment&&typeof r.assessment.id==='string'&&r.assessment.id.startsWith('AS-'+id+'-')&&Array.isArray(r.assessment.domainResults)&&r.assessment.domainResults.length===6&&
 Array.isArray(r.draft.issues)&&Array.isArray(r.publications)&&CANONICAL.domains.every(d=>!!(r.a2Values||r.assessment.values)?.[d.id]);}
function readRepository(){
 const baseline={mode:'baseline',records:CANONICAL.defaults,notice:'원본 평가 규칙 기반 합성 사례'};
 if(location.protocol==='file:')return baseline;
 try {
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw)return baseline;
  const data=JSON.parse(raw);
  if(!data||typeof data!=='object'||Array.isArray(data)||!Object.entries(data).every(([id,r])=>CANONICAL.cases.some(c=>c.id===id)&&validRecord(r,id)))throw Error('Invalid storage');
  return {mode:'saved',records:{...CANONICAL.defaults,...data},notice:'같은 출처의 기존 합성 기록 · 읽기 전용'};
 }catch{return {mode:'invalid',records:CANONICAL.defaults,notice:'저장자료를 확인할 수 없어 기본 합성 사례 표시'};}
}
let source=readRepository();
function record(id){return source.records[id]||CANONICAL.defaults[id];}
function caseValues(id){const r=record(id);return r?.a2Values||r?.assessment?.values||{};}
function evaluatedValues(id,preview=false){
 const base=caseValues(id),values={};
 CANONICAL.domains.forEach(d=>values[d.id]={...(base[d.id]||{})});
 if(preview)for(const [key,value] of Object.entries(state.values)){
  if(!key.startsWith(id+'.'))continue;
  const parts=key.split('.');if(parts.length===3&&values[parts[1]])values[parts[1]][parts[2]]=value||null;
 }
 return values;
}
function reviewResults(id,preview=false){return CANONICAL.evaluateAll(evaluatedValues(id,preview));}
function derivePatient(c){
 const r=record(c.id),results=CANONICAL.evaluateAll(caseValues(c.id));
 const incomplete=results.some(x=>x.status!=='READY'),dirty=!!r.a2Dirty;
 const status=r.draft?.status||'DRAFT';
 const unresolved=Array.isArray(r.draft?.issues)&&r.draft.issues.some(x=>x.status!=='RESOLVED');
 let next,go,tone;
 if(dirty||incomplete){next=dirty?'변경 평가 확인':'미완료 평가 확인';go='assessment';tone='amber';}
 else if(status==='PUBLISHED'){next='발행 이력 확인';go='review';tone='green';}
 else if(status==='REVOKED'){next='철회 기록 확인';go='review';tone='red';}
 else if(status==='REVIEW_REQUESTED'||status==='APPROVED'||status==='CHANGES_REQUESTED'||unresolved){next='검토 사항 확인';go='review';tone='blue';}
 else{next='퇴원계획 작성';go='plan';tone='blue';}
 return {id:c.id,name:c.name,age:c.age,context:c.context,date:c.discharge.slice(5).replace('-','.'),
 assessment:dirty?'평가 변경 인계 필요':incomplete?'미평가 '+results.filter(x=>x.status!=='READY').length+'영역':'필수값 확인됨',
 plan:PLAN_STATES[status],next,go,tone,status,dirty,incomplete,results};
}

 <div class="detail-grid"><section class="table-shell"><div class="panel-pad"><h2 class="section-title">현재 확인할 업무</h2><p class="section-caption">원본 기록의 참고 정보입니다. 최종 발행 가능 여부는 기존 A3에서만 판정합니다.</p></div><ul class="blockers-list">
 <li class="blocker-row"><span class="bubble">${icon('clipboard-list')}</span><div class="blocker-text"><strong>평가 상태·인계 확인</strong><p>${esc(assessmentSummary)}</p></div><a href="#/patient/${state.patientId}/assessment" class="inline-link" data-view="assessment">평가 열기 ${icon('arrow-right')}</a></li>

}

// Keep the active input node intact while filtering; this also protects Korean IME composition.
function refreshPatientResults(){
 if(state.view!=='patients')return;
 const currentRows=document.querySelector('.data-table tbody');
 if(!currentRows)return;
 const fragment=document.createElement('template');
 fragment.innerHTML=patients();
 const nextRows=fragment.content.querySelector('.data-table tbody');
 if(nextRows)currentRows.replaceChildren(...nextRows.children);
}
const views={home,patients,inbox,overview,assessment,plan,review,guide};
const names={home:'업무 홈',patients:'환자 목록',inbox:'검토 업무함',overview:'환자 개요',assessment:'돌봄 필요도 평가',plan:'퇴원계획 작성',review:'검토·승인·발행',guide:'사용법·체험 안내'};
function paintIcons(scope=document){scope.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon)});}
function render({focus=false,keepScroll=false,routeTransition=false}={}){
 if(!current()&&['overview','assessment','plan','review'].includes(state.view))state.view='patients';
 const main=document.getElementById('main-content');
 main.innerHTML=views[state.view]();
 if(routeTransition)main.querySelector('.screen')?.classList.add('page-enter');
 document.getElementById('crumb-current').textContent=names[state.view];
 document.querySelectorAll('.nav-item[data-view]').forEach(el=>{const active=el.dataset.view===state.view;el.classList.toggle('active',active);const disabled=el.classList.contains('patient-route')&&!current();if(disabled){el.setAttribute('aria-disabled','true');el.setAttribute('tabindex','-1');}else{el.removeAttribute('aria-disabled');el.removeAttribute('tabindex');}if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});
 document.getElementById('nav-patient-label').textContent=current()?current().name:'선택 전';
 document.querySelector('.prototype-pill') .textContent='UX 2.0 v0.5 · '+(source.mode==='saved'?'기존 기록 읽기':'원본 사례');
 paintIcons();if(!keepScroll)window.scrollTo({top:0,behavior:'instant'});if(focus)document.getElementById('main-content').focus({preventScroll:true});
}
function closeMenu(){state.menu=false;document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').hidden=true;}
const patientRoutes=['overview','assessment','plan','review'];
function routeFor(view=state.view){return patientRoutes.includes(view)?`#/patient/${state.patientId}/${view}`:`#/${view}`;}
function goto(view){if(!views[view])return;if(patientRoutes.includes(view)&&!current())return;state.view=view;closeMenu();const target=routeFor();if(location.hash!==target)location.hash=target;else render({focus:true,routeTransition:true});}
function choosePatient(id,target='overview'){if(!people.some(p=>p.id===id))return;state.patientId=id;state.domainId='medical';state.planTab='today';state.practice=false;state.values={};goto(views[target]?target:'overview');}
function syncHash({focus=true,routeTransition=false}={}){const p=location.hash.replace(/^#\/?/,'').split('/');if(p[0]==='patient'&&people.some(x=>x.id===p[1])){state.patientId=p[1];state.view=patientRoutes.includes(p[2])?p[2]:'overview';}else if(views[p[0]]&&!patientRoutes.includes(p[0])){state.view=p[0];}else state.view='home';closeMenu();render({focus,routeTransition});}
window.addEventListener('hashchange',()=>syncHash({routeTransition:true}));
let toastTimer;
function toast(message){const el=document.getElementById('toast');el.innerHTML=`<div class="toast-message">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.replaceChildren(),3600);}
function dialog(title,body,kicker='설계 시안 안내'){const d=document.getElementById('info-dialog');document.getElementById('dialog-kicker').textContent=kicker;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;d.showModal();}
function doAction(action){
 if(action==='density-toggle'){state.density=state.density==='normal'?'compact':'normal';render({keepScroll:true});return;}
 if(action==='panel-toggle'){state.resultOpen=!state.resultOpen;render({keepScroll:true});return;}
 if(action==='plan-split'||action==='plan-focus'){state.planLayout=action==='plan-focus'?'focus':'split';render({keepScroll:true});return;}
 if(action==='practice-toggle'){state.practice=!state.practice;state.values={};render({keepScroll:true});return;}
 if(action==='source-refresh'){refreshSource();render({keepScroll:true});toast(source.notice);return;}

 if(action==='menu-open'){state.menu=true;document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').hidden=false;return;}
 if(action==='menu-close'){closeMenu();return;}
 if(action==='assessment-next'){let i=domains.findIndex(x=>x.id===state.domainId);if(i===domains.length-1)goto('plan');else{state.domainId=domains[i+1].id;render({focus:true})}return;}
 if(action==='review-info'){dialog('실제 승인·발행은 기존 시스템에서 수행합니다.',`<p>UX 2.0 v0.5는 A2 평가 입력·저장·인계를 원본 평가 함수에 연결했습니다. A3의 검토 요청·승인·발행은 여전히 기존 시스템에서 수행합니다.</p><p>기존 시스템은 평가 인계 → 안내·문서 검토 → 검토 요청 → 최종 승인자 승인 → 발행 순서로 동작합니다. 새 화면에서도 승인·발행 안전 규칙은 기존 엔진에서만 처리합니다.</p>`,'기존 기능 보호');return;}
}
document.addEventListener('click',e=>{
 const action=e.target.closest('[data-action]');if(action){e.preventDefault();doAction(action.dataset.action);return;}
 const open=e.target.closest('[data-open]');if(open){e.preventDefault();choosePatient(open.dataset.open,open.dataset.target||'overview');return;}
 const domain=e.target.closest('[data-domain]');if(domain){state.domainId=domain.dataset.domain;render({focus:false,keepScroll:true});document.querySelector(`[data-domain="${state.domainId}"]`)?.focus({preventScroll:true});return;}
 const tab=e.target.closest('[data-plan-tab]');if(tab){state.planTab=tab.dataset.planTab;render({focus:false,keepScroll:true});document.querySelector(`[data-plan-tab="${state.planTab}"]`)?.focus({preventScroll:true});return;}
 const view=e.target.closest('[data-view]');if(view){e.preventDefault();goto(view.dataset.view);return;}
});
document.getElementById('scrim').addEventListener('click',closeMenu);
document.addEventListener('change',e=>{
 if(e.target.id==='status-filter'){state.filter=e.target.value;render({keepScroll:true});document.getElementById('status-filter').focus();return;}
 if(e.target.matches('[data-assessment-key]')){const key=e.target.dataset.assessmentKey;if(!state.practice)return;state.values[`${state.patientId}.${e.target.dataset.assessmentDomain}.${key}`]=e.target.value;render({keepScroll:true});const target=document.getElementById(`field-${key}`);target?.focus();return;}
});
let searchComposing=false;
document.addEventListener('compositionstart',e=>{if(e.target.id==='patient-search')searchComposing=true;});
document.addEventListener('compositionend',e=>{if(e.target.id!=='patient-search')return;searchComposing=false;state.search=e.target.value;refreshPatientResults();});
document.addEventListener('input',e=>{
 if(e.target.id==='patient-search'){state.search=e.target.value;if(!searchComposing)refreshPatientResults();return;}
 if(e.target.matches('[data-plan-key]')){const key=`${state.patientId}.${e.target.dataset.planKey}`;state.notes[key]=e.target.value;const preview=document.getElementById('preview-text');if(preview)preview.textContent=e.target.value;return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.menu)closeMenu();});
paintIcons();syncHash({focus:false});



</script>
<script>

/* Hospital UX 2.0 v0.5: compact navigation and source-authoritative A2 transitions.
   Genuine editing only runs when served from the same origin as integrated-v10 modules. */
(()=>{
 'use strict';
 const UX_KEY='carebridge-hospital-ux2-rail-v05';
 const preference=()=>{try{return localStorage.getItem(UX_KEY)==='compact'}catch{return false}};
 const ux={compact:preference(),ready:false,live:false,lastPatient:null,modules:null,loading:false};
 const narrow=()=>matchMedia('(max-width:700px)').matches;
 const sidebar=document.getElementById('sidebar');
 const captions=[...sidebar.querySelectorAll('.nav-caption')];
 captions.forEach((el,i)=>el.dataset.short=['전체','환자','안내'][i]||'메뉴');
 const shorthand={home:'홈',patients:'환자',inbox:'검토',overview:'개요',assessment:'평가',plan:'계획',review:'발행',guide:'도움'};
 for(const item of sidebar.querySelectorAll('.nav-item[data-view]')){
  const text=[...item.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(' ').trim();
  for(const node of [...item.childNodes])if(node.nodeType===3)node.remove();
  if(!text)continue;
  const full=document.createElement('span');full.className='nav-full-label';full.textContent=text;
  const short=document.createElement('span');short.className='nav-compact-label';short.textContent=shorthand[item.dataset.view]||text;
  const badge=item.querySelector('.nav-counter');
  item.insertBefore(full,badge||null);item.insertBefore(short,badge||null);
  item.setAttribute('aria-label',text);
  item.title=text+(item.classList.contains('patient-route')&&!state.patientId?' · 환자 선택 후 사용':'');
 }
 const collapse=document.createElement('button');
 collapse.type='button';collapse.className='brand-collapse-toggle';collapse.setAttribute('aria-controls','sidebar');
 collapse.setAttribute('data-ux5','rail');collapse.title='사이드 메뉴 접기·펼치기';
 sidebar.querySelector('.brand-block').insertBefore(collapse,sidebar.querySelector('.sidebar-close'));
 function paintRail(){
  sidebar.classList.toggle('rail-compact',ux.compact);
  collapse.textContent=ux.compact?'›':'‹';
  collapse.setAttribute('aria-expanded',String(!ux.compact));
  collapse.setAttribute('aria-label',ux.compact?'사이드바 펼치기':'사이드바 접기');
  const mobile=document.querySelector('.mobile-menu');
  mobile.setAttribute('aria-expanded',String(sidebar.classList.contains('open')));
  mobile.setAttribute('aria-controls','sidebar');
  mobile.setAttribute('aria-label',sidebar.classList.contains('open')?'전체 메뉴 닫기':'전체 메뉴 열기');
  // Closed off-canvas navigation must not remain keyboard focusable.
  if(narrow())sidebar.inert=!sidebar.classList.contains('open');
  else sidebar.inert=false;
 }
 function formatLiveControl(){
  if(state.view!=='assessment'||!state.patientId)return;
  const bar=document.querySelector('.ui-control-line');
  const root=document.querySelector('.assessment-grid');
  if(!bar||!root)return;
  const button=document.createElement('button');
  button.type='button';button.className='btn ux5-live-button'+(ux.live?' btn-soft':'');
  button.dataset.ux5='live';
  button.textContent=ux.live?'실제 입력 종료': 'A2 평가 편집·저장';
  button.disabled=!ux.ready&&!ux.live;
  if(!ux.ready)button.title='같은 웹 출처에서 원본 평가 모듈을 열어야 사용할 수 있습니다.';
  bar.prepend(button);
  if(ux.live){
   const p=record(state.patientId);
   const allowed=['DRAFT','REVIEW_REQUESTED','CHANGES_REQUESTED','APPROVED'].includes(p?.draft?.status);
   const hint=document.createElement('div');hint.className='ux5-save-hint';
   hint.textContent=allowed?'합성 기록을 바꾸면 기존 승인은 무효화되며 평가 인계와 계획 재검토가 필요합니다. 선택값은 매번 저장됩니다.':'이미 발행·철회된 계획은 새 버전 개정 후 원본 시스템에서 수정할 수 있습니다.';
   root.before(hint);
   bar.querySelector('[data-action="practice-toggle"]')?.setAttribute('disabled','');
   const selectList=document.querySelectorAll('[data-assessment-key]');
   selectList.forEach(el=>{el.disabled=!allowed});
   const sourceLine=document.querySelector('.source-inline span');
   if(sourceLine)sourceLine.textContent='원본 A2 기준 · 실제 합성 평가 입력'+(allowed?' (저장 활성)':' (편집 불가)');
   const s=document.createElement('div');s.className='ux5-live-action';
   if(p?.a2Dirty&&allowed){
    const handoff=document.createElement('button');handoff.type='button';handoff.className='btn btn-primary';handoff.dataset.ux5='handoff';handoff.textContent='변경된 평가 A3로 인계';
    s.append(handoff);
   }
   const notice=document.createElement('span');notice.className='ux5-live-status';
   notice.textContent=p?.a2Dirty?'아직 계획에 인계되지 않은 평가 변경이 있습니다.':'평가 변경·인계가 필요한 경우 이곳에 표시됩니다.';
   s.append(notice);root.after(s);
  }
 }
 const originalRender=render;
 render=function(options){
  if(ux.lastPatient!==state.patientId){ux.live=false;ux.lastPatient=state.patientId}
  originalRender(options);
  formatLiveControl();
  paintRail();
 };
 const originalDoAction=doAction;
 doAction=function(action){originalDoAction(action);if(action==='menu-open'||action==='menu-close')paintRail()};
 document.addEventListener('click',event=>{
  const control=event.target.closest('[data-ux5]');
  if(!control)return;
  event.preventDefault();event.stopImmediatePropagation();
  if(control.dataset.ux5==='rail'){
   ux.compact=!ux.compact;
   try{localStorage.setItem(UX_KEY,ux.compact?'compact':'expanded')}catch{}
   paintRail();collapse.focus();
  }else if(control.dataset.ux5==='live'){
   if(!ux.ready){toast('기존 평가 모듈을 사용할 수 없는 실행 환경입니다.');return}
   ux.live=!ux.live;
   state.practice=false;state.values={};
   render({keepScroll:true});
  }else if(control.dataset.ux5==='handoff'){
   if(!ux.live)return;
   if(!confirm('변경된 평가를 A3 계획에 인계할까요? 이미 검토한 안내·문서도 다시 확인해야 합니다.'))return;
   persistAction('handoff');
  }
 },true);
 document.addEventListener('change',event=>{
  const el=event.target;
  if(!ux.live||!el.matches('[data-assessment-key]'))return;
  event.preventDefault();event.stopImmediatePropagation();
  persistAction('edit',el.dataset.assessmentDomain,el.dataset.assessmentKey,el.value||null);
 },true);
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&narrow()){
   // The original navigation Escape handler may already have closed the drawer.
   // Always synchronize ARIA and focus, regardless of listener order.
   const wasOpen=sidebar.classList.contains('open')||state.menu;
   if(wasOpen)closeMenu();
   paintRail();
   document.querySelector('.mobile-menu')?.focus();
  }
 });
 document.querySelector('.mobile-menu')?.addEventListener('click',()=>requestAnimationFrame(paintRail));
 document.getElementById('scrim')?.addEventListener('click',()=>requestAnimationFrame(paintRail));
 window.addEventListener('resize',paintRail);
 function persistAction(kind,domain,field,value){
  if(!ux.ready||!ux.modules)return;
  try {
   const {evaluation,storage}=ux.modules;
   const id=state.patientId;
   if(!CANONICAL.cases.some(p=>p.id===id))throw Error('선택한 환자를 다시 확인하세요.');
   const store=storage.loadRepository(localStorage,storage.STORAGE_KEYS.normal);
   if(store.error)throw Error('기존 합성 저장 기록이 유효하지 않습니다. 저장을 중지했습니다.');
   storage.initializePatients(store.records);
   const before=store.records[id];
   if(!before)throw Error('선택한 환자 기록을 찾지 못했습니다.');
   if(!['DRAFT','REVIEW_REQUESTED','CHANGES_REQUESTED','APPROVED'].includes(before.draft.status))throw Error('발행 중인 계획은 개정 후 평가해야 합니다.');
   const next=kind==='handoff'?
    evaluation.commitEvaluation(before,'NURSE'):
    evaluation.editEvaluation(before,domain,field,value,'NURSE');
   if(next===before){toast('변경된 값이 없습니다.');return;}
   store.records[id]=next;
   storage.persistRepository(localStorage,storage.STORAGE_KEYS.normal,store);
   refreshSource();
   render({keepScroll:true});
   toast(kind==='handoff'?'평가 인계 완료 · 계획·첨부 재검토 필요':'A2 합성 평가값 저장됨 · 승인 무효화 및 재인계 필요');
  }catch(error){
   refreshSource();render({keepScroll:true});
   toast('저장하지 않았습니다: '+(error?.message||'저장 오류'));
  }
 }
 async function loadLiveModules(){
  if(!/^https?:$/.test(location.protocol)||ux.loading)return;
  ux.loading=true;
  try {
   const b=new URL('../integrated-v10/',location.href);
   const [evaluation,storage]=await Promise.all([
    import(new URL('shared/evaluation-edit.js',b).href),
    import(new URL('a3/storage.js',b).href)
   ]);
   // Verify true source modules; never write if those APIs are not available.
   if(typeof evaluation.editEvaluation!=='function'||typeof evaluation.commitEvaluation!=='function'||
      typeof storage.loadRepository!=='function'||typeof storage.persistRepository!=='function')throw Error('모듈 불완전');
   ux.modules={evaluation,storage};ux.ready=true;
  }catch(error){ux.ready=false}
  render({keepScroll:true});
 }
 paintRail();
 formatLiveControl();
 loadLiveModules();
})();

</script>
<script src="integration.js"></script>
</body>
